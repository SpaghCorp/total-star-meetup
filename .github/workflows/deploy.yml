name: Deploy site to GitHub Pages

# Publishes the static site in ./site to GitHub Pages.
# No build step — the folder is uploaded as-is.

on:
  push:
    branches:
      - main
      - master
      - claude/geometry-dash-stats-site-km709f
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Least-privilege token that can still publish Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement: true turns Pages on (build type "workflow") on first run.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
